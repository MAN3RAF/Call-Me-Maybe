[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs - 42 Project"
readme = "README.md"
requires-python = ">=3.10"
# Mandatory dependencies for the project logic
dependencies = [
    "huggingface>=0.0.1",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "torch>=2.11.0",
    "transformers>=4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This fixes the "Failed to build" error by pointing to your code folder
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Using the new format to remove the 'deprecated' warning
[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.6.0",
    "types-setuptools",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
